project_id = "xfqffqxqiuqauefrrcxn"

# =====================================================================
# Blocos abaixo valem apenas para o stack LOCAL (`supabase start`).
# Não alteram nada no projeto hospedado.
# =====================================================================

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Captura todos os e-mails locais (Auth, magic link, recuperação de senha).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.product-images]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/avif", "image/svg+xml"]

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080", "http://127.0.0.1:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Somente local: sem SMTP offline, confirmar por e-mail travaria o login.
enable_confirmations = false
secure_password_change = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[realtime]
enabled = true

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.mercadopago-webhook]
verify_jwt = false

[functions.track-visit]
verify_jwt = false

[functions.order-stream]
verify_jwt = false

[functions.notify-order-status]
verify_jwt = false
